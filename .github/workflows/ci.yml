name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (inside_the_game)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest -q

  touchline:
    name: Touchline (node + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: node tests
        working-directory: touchline
        run: npm test

  scene:
    name: Pitch sample (three.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: touchline/scene
        run: npm install
      - name: vitest
        working-directory: touchline/scene
        run: npm test
      - name: typecheck and build
        working-directory: touchline/scene
        run: npm run build

  synthetic-data:
    name: Synthetic data gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the checked-in sample
        run: |
          python touchline/scripts/synth/validate.py \
            touchline/data/samples/sample_25hz_10min
      - name: Check the committed decisions are current
        run: |
          python scripts/export_decisions.py --output /tmp/decisions.json
          python - <<'PY'
          import json
          import sys
          fresh = json.load(open("/tmp/decisions.json"))
          checked = json.load(open("touchline/scene/public/decisions.json"))
          if fresh["decisions"] != checked["decisions"]:
              sys.exit("decisions.json is stale. Run: python scripts/export_decisions.py")
          print(f"{fresh['decision_count']} decisions match")
          PY
