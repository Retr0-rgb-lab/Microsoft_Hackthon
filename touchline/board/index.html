<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coach board</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view" aria-label="Coach board pitch"></canvas>
      <header class="hud">
        <div class="brand">
          <p class="eyebrow">Inside the Game</p>
          <h1>Coach board</h1>
          <p class="sub" id="clip-label">105 × 68 m</p>
        </div>
        <div class="cam-toggle" role="group" aria-label="Camera">
          <button id="cam-broadcast" type="button" aria-pressed="true">Broadcast</button>
          <button id="cam-top" type="button" aria-pressed="false">Top-down</button>
        </div>
      </header>
      <nav class="tools" aria-label="Tools">
        <button type="button" data-tool="pass" aria-pressed="true"><i class="swatch pass"></i>Pass</button>
        <button type="button" data-tool="carry" aria-pressed="false"><i class="swatch carry"></i>Carry</button>
        <button type="button" data-tool="shot" aria-pressed="false"><i class="swatch shot"></i>Shot</button>
        <button type="button" data-tool="formation" aria-pressed="false">Formation</button>
        <button type="button" id="fill-formation">Fill formation from this frame</button>
        <label class="label-field">Formation name
          <input id="formation-label" type="text" value="4-3-3" maxlength="24" />
        </label>
        <button type="button" id="download">Download board.json</button>
      </nav>
      <section id="ghost-panel" hidden aria-live="polite">
        <p class="eyebrow" id="ghost-source"></p>
        <p class="ghost-title" id="ghost-title"></p>
        <ul class="bars" id="ghost-bars"></ul>
        <p class="ghost-note" id="ghost-note"></p>
        <p class="footnote" id="ghost-foot">Categories come from a softmax fitted on heuristic labels; this is not an optimal decision.</p>
      </section>
      <section id="ink-edit" hidden>
        <p class="ghost-title" id="ink-edit-title"></p>
        <div id="pass-fields">
          <label>Method
            <select id="pass-style">
              <option value="ground">Ground</option>
              <option value="loft">Lofted</option>
            </select>
          </label>
          <label>Curve
            <select id="pass-curve">
              <option value="straight">Straight</option>
              <option value="curved">Curved</option>
            </select>
          </label>
        </div>
        <div id="shot-fields">
          <label>Method
            <select id="shot-style">
              <option value="unset">Unset</option>
              <option value="driven">Driven</option>
              <option value="placed">Placed</option>
              <option value="chip">Chip</option>
            </select>
          </label>
        </div>
        <button type="button" id="ink-delete">Delete</button>
      </section>
      <p class="hint">Space pause · 1 / b broadcast · 2 / t top-down · Tab accept · Esc dismiss</p>
      <footer class="transport">
        <button id="play" type="button">Pause</button>
        <input id="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Time" />
        <p id="status" role="status">Loading the sample…</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
